{% for app in applications %}
<p>
    Student: {{ app.student.name }} |
    Status: {{ app.status }}

    <a href="/company/application/{{ app.id }}/Shortlisted">Shortlist</a>
    <a href="/company/application/{{ app.id }}/Selected">Select</a>
    <a href="/company/application/{{ app.id }}/Rejected">Reject</a>

    <a href="/company/student/{{ app.student.id }}">View Profile</a>
</p>
{% endfor %}
