{% extends "base.html" %}
{% block title %}Create Drive{% endblock %}

{% block content %}

<h2 class="mb-4">Create Placement Drive</h2>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="POST">

            <input type="text" name="title" class="form-control mb-3"
                   placeholder="Job Title" required>

            <textarea name="description" class="form-control mb-3"
                      placeholder="Job Description"></textarea>

            <textarea name="eligibility" class="form-control mb-3"
                      placeholder="Eligibility"></textarea>

            <input type="number" step="0.01" name="min_cgpa"
                   class="form-control mb-3" placeholder="Minimum CGPA">

            <input type="date" name="deadline"
                   class="form-control mb-3" required>

            <button class="btn btn-success">Create Drive</button>

        </form>

    </div>
</div>

{% endblock %}
