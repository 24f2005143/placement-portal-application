{% extends "base.html" %}
{% block title %}Edit Drive{% endblock %}

{% block content %}

<h2 class="mb-4">Edit Drive</h2>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="POST">

            <input type="text" name="title"
                   value="{{ drive.title }}"
                   class="form-control mb-3" required>

            <textarea name="description"
                      class="form-control mb-3">{{ drive.description }}</textarea>

            <textarea name="eligibility"
                      class="form-control mb-3">{{ drive.eligibility }}</textarea>

            <input type="number" step="0.01"
                   name="min_cgpa"
                   value="{{ drive.min_cgpa }}"
                   class="form-control mb-3">

            <input type="date"
                   name="deadline"
                   value="{{ drive.deadline.strftime('%Y-%m-%d') if drive.deadline else '' }}"
                   class="form-control mb-3">

            <button class="btn btn-primary">Update Drive</button>

        </form>

    </div>
</div>

{% endblock %}
